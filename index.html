e the provinces and focus only on court ceremonies.", "Unaddressed political and religious grievances could grow into open revolt."]]}, "questions": [{"q": "Your council sees people in the Netherlands resisting Philip II of Spain. Explain TWO reasons people in the Netherlands resisted his rule, using details from this mission.", "concepts": [["religion", "catholic", "calvin", "protestant", "persecut", "toleran"], ["tax", "spanish", "control", "independen", "rule", "power"]], "hint": "Look again at Philip II's religious policies and his attempts to tighten political control."}, {"q": "What is a nation-state, and why did European rulers try to strengthen their control over one?", "concepts": [["territor", "country", "nation", "land", "border", "people"], ["government", "rule", "power", "control", "authority", "unify"]], "hint": "Find the sentence that defines a nation-state, then connect it to royal authority."}], "vocab": [{"term": "nation-state", "clue": "Look for the description of a government ruling a defined territory."}, {"term": "religious persecution", "clue": "Think about what happens when people are punished or restricted for their beliefs."}]}, {"title": "The King and the Commons", "era": "England, 1620s–1649 · Lesson 3", "scene": "A messenger arrives: King Charles I needs money. Parliament refuses to give him unlimited control over taxation. Tensions are rising.", "reading": ["England's Parliament claimed an important role in approving taxes and making laws. Charles I believed strongly in royal authority and repeatedly clashed with Parliament. He ruled for years without calling it, then needed funds and summoned it again. Charles I tried to collect money and govern without Parliament’s approval. Parliament insisted that it had the right to approve taxes and limit the king’s authority. Their refusal to compromise deepened the conflict and helped lead to war.", "The English Civil War was a war in England between forces supporting King Charles I (Royalists) at followed."}], "vocab": [{"term": "English Civil War", "clue": "Define the conflict and identify the two sides."}, {"term": "republic", "clue": "Describe a state without a hereditary monarch as its head of state."}]}, {"title": "A Crown With Conditions", "era": "England, 1688–1689 · Lessons 1 and 3", "scene": "Parliament fears that James II will rule without respecting its rights. You must advise leaders deciding whether to invite William and Mary to take the throne.", "reading": ["After the monarchy was restored, conflicts between kings and Parliament continued. James II's Catholic faith and actions alarmed many Protestant leaders and members of Parliament. In 1688, influential English figures invited William of Orange and his wife Mary to intervene. Many leaders feared that James II would favor Catholicism and ignore Parliament’s rights and political authority.", "James II fled, and Parliament offered the crown to William and Mary. The Glorious Revolution was the replacement of James II by William and Mary in 1688–1689, a change that strengthened Parliament and helped limit royal power. It involved relatively little bloodshed in England compared with the earlier civil war.", "The English Bill of Rights of 1689 strengthened Parliament's position. It affirmed that monarchs could not simply suspend laws or raise certain taxes without Parliament. A constitutional monarchy is a system in which a king or queen rules under laws that limit royal power, and institutions such as Parliament share governing authority. England developed this type of limited monarchy."], "decision": {"prompt": "William and Mary ask: 'Can we rule as absolute monarchs?' What does your council say?", "options": [["No. The Bill of Rights places limits on the monarch and protects Parliament's role.", "Exactly the constitutional direction England took after 1688–1689."], ["Yes. The Glorious Revolution abolished Parliament.", "Parliament became stronger, not weaker."], ["Yes. A monarch's wishes now d independent centers of power.", "Louis also sought religious uniformity, pressuring French Protestants known as Huguenots. His lavish court and expensive wars strained France's finances. Strong royal authority came with serious costs for the country and its people. The pressure on Huguenots limited their religious freedom, while the expensive wars and lavish court consumed money that could otherwise have supported the country."], "decision": {"prompt": "Three nobles are building independent power in their provinces. What plan would best fit Louis XIV's strategy?", "options": [["Bring them to Versailles, where royal attention and court life keep them close.", "Versailles helped Louis monitor nobles and keep them dependent on royal favor."], ["Give them their own armies and independent tax powers.", "That would make the nobles less dependent on the crown."], ["Stop appointing royal officials and let nobles make all policy.", "Louis centralized important decisions instead of surrendering them."]]}, "questions": [{"q": "Your council recommends bringing powerful nobles to the Palace of Versailles. Explain HOW keeping nobles at Versailles helped King Louis XIV maintain power.", "concepts": [["noble", "aristocrat", "lord", "powerful", "rival"], ["versailles", "palace", "court", "watch", "supervis", "control", "favor", "close", "depend"]], "hint": "Why might a noble competing for the king's attention be less able to challenge him from home?"}, {"q": "Louis XIV claims that his authority comes from God. What is this belief called, and how does it support absolutism (rule by an absolute monarch)?", "concepts": [["divine", "god", "religious", "heaven"], ["absolute", "unlimited", "total", "supreme", "power", "authority", "rule"]], "hint": "Review the first reading paragraph and connect divine right to royal authority."}, {"q": "Name TWO costs or problems caused by Louis XIV's policies, using evidence from the mission.", "concepts": [["war", "militar", "fight", "battle", "expen  const reviewPage=page(`<h2>Answer Review Report</h2><p class="small">Automated suggestions only. These are not grades.</p><p><b>Appears addressed:</b> ${reviewCounts().ready} &nbsp; <b>Needs attention / missing:</b> ${reviewCounts().flagged} &nbsp; <b>Not checked:</b> ${reviewCounts().unchecked}</p>${qs.map((q,i)=>`<p class="review-line"><b>Question ${i+1}:</b> ${esc(questionReviewStatus(i+1).label)}${questionReviewStatus(i+1).kind==='warn'?` — ${esc(questionReviewStatus(i+1).detail)}`:''}</p>`).join('')}`,'review-page');
 return `<!doctype html><html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><title>Topic 5 Guided Reading 1 - ${esc(state.name)}</title>
 <style>
 @page{size:letter;margin:.56in .68in .56in .68in}
 body{font-family:Calibri,Arial,sans-serif;color:#111;font-size:10pt;line-height:1.18;margin:0}
 .print-page{page-break-inside:avoid}

 h1{font-size:15pt;margin:0 0 5pt}h2{font-size:13pt;margin:0 0 12pt;padding-bottom:5pt;border-bottom:1px solid #777}
 p{margin:4pt 0}.subtitle{font-size:11pt;margin-bottom:8pt}
 .doc-heading{margin-bottom:13pt;border-bottom:1px solid #aaa;padding-bottom:8pt}
 .questions{width:100%}.question{page-break-inside:avoid;break-inside:avoid;margin:0 0 7pt;padding:0 0 4pt;border-bottom:1px solid #e5e5e5}
 .question-title{font-size:10pt;line-height:1.15}
 .student-answer{white-space:pre-wrap;margin:4pt 0 0 12pt;font-size:9.5pt;line-height:1.15;overflow-wrap:break-word}

 </style></head><body>${questions1}<p class="word-page-break" style="page-break-before:always;break-before:page"><br style="mso-special-character:line-break;page-break-before:always"></p>${questions2}<p class="word-page-break" style="page-break-before:always;break-before:page"><br style="mso-special-character:line-break;page-break-before:always"></p>${vocabPage}<p class="word-page-break" style="page-break-before:always;break-before:page"><br style="mso-special-character:line-break;page-break-before:always"></p>${reviewPage}</body></html>`;
}
function textReport(){return `WORLD HISTORY TOPIC 5 GUIDED READING #1\nTHE KING'S COUNCIL\nStudent: ${state.name}\nClass: ${state.classroom}\n\n`+allQs().map((q,i)=>`${i+1}. ${q.q}\n${answerText(i+1)||'[No response]'}\n`).join('\n')+'\nVOCABULARY\n'+allV().map((v,i)=>`${i+1}. ${v.term}\n${state.vocab[i+1]||'[No response]'}\n`).join('\n')}function download(type){let blob=new Blob([type==='doc'?reportHTML():textReport()],{type:type==='doc'?'application/msword':'text/plain;charset=utf-8'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Topic5_GR1_'+(state.name||'Student').replace(/[^a-z0-9]+/gi,'_')+'.'+type;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},300)}function finish(){let missing=allQs().map((q,i)=>!QUESTION_PARTS[i].every((p,k)=>readPart(i+1,k).trim())?`Question ${i+1}`:null).filter(Boolean).concat(allV().map((v,i)=>!state.vocab[i+1]?.trim()?v.term:null).filter(Boolean));app.innerHTML=`<section class="panel"><div class="eyebrow">Review and submit</div><h1>Your Guided Reading</h1><p><b>${esc(state.name)}</b> · ${esc(state.classroom)}</p><p><b>${count()} of 20</b> responses entered.</p>${missing.length?`<div class="feedback warn"><b>Still missing:</b> ${esc(missing.join(', '))}. You can download your work now, but we recommend finishing these first.</div>`:`<div class="feedback good"><b>All responses entered.</b> Read them over before submitting. Completion does not mean every answer is correct.</div>`}<div class="review-panel"><h2>Answer Review Report</h2><p><b>${reviewCounts().ready}</b> appear addressed · <b>${reviewCounts().flagged}</b> need attention or are missing · <b>${reviewCounts().unchecked}</b> not checked.</p><p class="muted">These are automated suggestions, not grades. You may return to any question, revise it, and check again. You can still download and submit with warnings.</p>${reviewRows()}</div><p>Your downloaded file includes all <b>12 questions and answers</b> plus <b>8 vocabulary definitions</b>. Your teacher will grade it and print a copy for your test notes.</p><div class="actions"><button id="doc">Download Completed Guided Reading (.doc)</button><button class="secondary" id="back">← Revise answers</button></div><div class="read"><b>Schoology submission instructions</b><p>1. Download your Guided Reading document. 2. Open your teacher's Schoology assignment. 3. Upload the downloaded document and submit it. 4. If you cannot upload, keep the file saved and tell your teacher.</p><p><b>Important:</b> Downloading does not submit your work to Schoology automatically.</p></div><p class="foot">Your answers are stored only in this browser on this device. Download your completed Guided Reading and upload it to Schoology.</p></section>`;document.querySelectorAll('.review-jump').forEach(b=>b.onclick=()=>{state.finished=false;state.mission=Number(b.dataset.mission);pageMode='mission';save();draw();window.scrollTo(0,0)});document.getElementById('doc').onclick=()=>download('doc');document.getElementById('back').onclick=()=>{state.finished=false;state.mission=0;pageMode='mission';save();draw()}}
